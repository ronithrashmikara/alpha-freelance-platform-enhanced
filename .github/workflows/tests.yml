name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Laravel tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # sqlite matches local development (phpunit.xml); pgsql matches production (Neon, PostgreSQL 17).
        db: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alpha_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Only the pgsql leg overrides phpunit.xml's in-memory SQLite.
      DB_CONNECTION: ${{ matrix.db == 'pgsql' && 'pgsql' || 'sqlite' }}
      DB_HOST: ${{ matrix.db == 'pgsql' && '127.0.0.1' || '' }}
      DB_PORT: ${{ matrix.db == 'pgsql' && '5432' || '' }}
      DB_DATABASE: ${{ matrix.db == 'pgsql' && 'alpha_test' || ':memory:' }}
      DB_USERNAME: ${{ matrix.db == 'pgsql' && 'postgres' || '' }}
      DB_PASSWORD: ${{ matrix.db == 'pgsql' && 'postgres' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, gd, zip, pdo_sqlite, pdo_pgsql
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      # Tests that document real bugs (tests/KnownBugs). They assert the correct
      # behaviour and are expected to fail until fixed; this step never fails the build.
      - name: Known bugs (expected to fail, non-blocking)
        continue-on-error: true
        run: php artisan test tests/KnownBugs

  frontend:
    name: Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
